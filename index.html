<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор скинов MultiCraft</title>
    <link rel="stylesheet" href="https://pyscript.net">
    <script type="module" src="https://pyscript.net"></script>
    <style>
        :root {
            --bg: #12151c; --card: #1c212c; --text: #e2e8f0;
            --muted: #94a3b8; --accent: #3b82f6; --accent-hover: #2563eb;
            --danger: #ef4444; --success: #22c55e; --border: #2e3646;
        }
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body {
            background: var(--bg); color: var(--text); margin: 0; padding: 20px;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            background: var(--card); border: 1px solid var(--border); border-radius: 16px;
            padding: 28px; width: 100%; max-width: 480px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        h1 { margin: 0 0 8px; font-size: 22px; text-align: center; }
        .subtitle { color: var(--muted); font-size: 14px; text-align: center; margin-bottom: 24px; }
        .step {
            margin-bottom: 18px; padding: 14px; background: rgba(0,0,0,0.2);
            border-radius: 10px; border: 1px solid var(--border);
        }
        .step label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
        input[type="file"], select, input[type="text"] {
            width: 100%; padding: 10px; background: var(--bg);
            border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px;
        }
        .color-row { display: flex; gap: 10px; align-items: center; }
        input[type="color"] { width: 50px; height: 40px; border: none; border-radius: 8px; background: none; cursor: pointer; }
        button {
            width: 100%; padding: 14px; background: var(--accent); color: white; border: none;
            border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 8px;
        }
        button:hover:not(:disabled) { background: var(--accent-hover); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .status { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 13px; line-height: 1.4; display: none; }
        .status.error { display: block; background: rgba(239,68,68,0.15); border: 1px solid var(--danger); color: #fca5a5; }
        .status.success { display: block; background: rgba(34,197,94,0.15); border: 1px solid var(--success); color: #86efac; }
        .status.info { display: block; background: rgba(59,130,246,0.15); border: 1px solid var(--accent); color: #93c5fd; }
        .preview-box { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
        #skinPreview {
            width: 48px; height: 48px; image-rendering: pixelated; border: 1px solid var(--border);
            border-radius: 6px; display: none;
            background: repeating-conic-gradient(#2e3646 0% 25%, #1c212c 0% 50%) 50% / 12px 12px;
        }
        #loader { text-align: center; color: var(--muted); font-size: 14px; padding: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>Редактор скинов MultiCraft</h1>
    <div class="subtitle">Замена скина (128×128) и цвета ника без консоли</div>
    <div id="loader">⏳ Загрузка Python-движка (3–5 сек)...</div>

    <div id="app" style="display: none;">
        <div class="step">
            <label>1. Загрузите файл multicraft.conf</label>
            <input type="file" id="confInput" accept=".conf,.txt">
        </div>
        <div class="step">
            <label>2. Загрузите скин (строго 128×128 PNG)</label>
            <input type="file" id="skinInput" accept="image/png">
            <div class="preview-box">
                <img id="skinPreview" alt="Превью">
                <span id="skinInfo" style="font-size: 13px; color: var(--muted);">Файл не выбран</span>
            </div>
        </div>
        <div class="step">
            <label>3. Выберите слот для замены</label>
            <select id="slotSelect" disabled>
                <option value="">Сначала загрузите multicraft.conf</option>
            </select>
        </div>
        <div class="step">
            <label>4. Цвет никнейма (подтягивается из слота)</label>
            <div class="color-row">
                <input type="color" id="colorPicker" value="#ffffff" disabled>
                <input type="text" id="hexInput" value="#FFFFFF" maxlength="7" disabled>
            </div>
        </div>
        <button id="saveBtn" disabled>Применить и скачать multicraft.conf</button>
        <div id="statusBox" class="status"></div>
    </div>
</div>

<script type="py" src="./main.py" config="./pyscript.toml"></script>
</body>
</html>
